x-postgres-url: &postgres-url
    postgres://fusion:${POSTGRES_PASSWORD:?required}@postgres/fusion

services:
    postgres:
        image: postgres:18.7
        environment:
            POSTGRES_USER: fusion
            POSTGRES_DB: fusion
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
        tmpfs:
            - /var/lib/postgresql
        ports:
            - 127.0.0.1:5432:5432
        healthcheck:
            test:
                - CMD
                - pg_isready
                - -h
                - 127.0.0.1
                - -U
                - fusion
                - -d
                - fusion
            interval: 2s
            timeout: 2s
            retries: 15
            # Docker's first probe waits one interval, so a
            # starting Postgres is asked every 200 ms.
            # start_interval needs Docker Engine 25.0 or later.
            start_period: 30s
            start_interval: 200ms

    server:
        build:
            context: .
            target: runtime
            args:
                FUSION_COMMIT_LOG_BASE64: ${FUSION_COMMIT_LOG_BASE64:-}
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PORT: ${PORT:?required}
            POSTGRES_URL: *postgres-url
            JWT_HMAC_SIGNING_KEY: ${JWT_HMAC_SIGNING_KEY:?required}
        ports:
            - 127.0.0.1:${PORT:?required}:${PORT:?required}
        stop_grace_period: 15s
        healthcheck:
            test:
                - CMD
                - deno
                - eval
                - --allow-net
                - --allow-env=PORT
                - >-
                  const r = await fetch('http://127.0.0.1:'
                  + Deno.env.get('PORT') + '/status');
                  Deno.exit(r.ok ? 0 : 1);
            interval: 2s
            timeout: 2s
            retries: 15
            start_period: 5s

    seed:
        build:
            context: .
            target: runtime
            args:
                FUSION_COMMIT_LOG_BASE64: ${FUSION_COMMIT_LOG_BASE64:-}
        profiles:
            - seed
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_URL: *postgres-url
        entrypoint:
            - ./render-out/fusion-angle
            - seed

    wipe:
        build:
            context: .
            target: runtime
            args:
                FUSION_COMMIT_LOG_BASE64: ${FUSION_COMMIT_LOG_BASE64:-}
        profiles:
            - wipe
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_URL: *postgres-url
        entrypoint:
            - ./render-out/fusion-angle
            - wipe
